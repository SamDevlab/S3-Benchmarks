name: Stage05 Paired Triage

on:
  push:
    paths:
      - "tools/triage_stage05_close_probe.py"
      - "tools/triage_stage05_conformance.py"
      - "tools/triage_stage05_call_gate.py"
      - "tests/test_triage_stage05_close_probe.py"
      - "tests/test_triage_stage05_conformance.py"
      - "tests/test_triage_stage05_call_gate.py"
      - ".github/workflows/stage05-paired-triage.yml"
  pull_request:
    paths:
      - "tools/triage_stage05_close_probe.py"
      - "tools/triage_stage05_conformance.py"
      - "tools/triage_stage05_call_gate.py"
      - "tests/test_triage_stage05_close_probe.py"
      - "tests/test_triage_stage05_conformance.py"
      - "tests/test_triage_stage05_call_gate.py"
      - ".github/workflows/stage05-paired-triage.yml"
  workflow_dispatch:

jobs:
  stage05-triage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pytest
      - name: Compile Stage05 triage
        run: |
          python -m compileall -q \
            tools/triage_stage05_close_probe.py \
            tools/triage_stage05_conformance.py \
            tools/triage_stage05_call_gate.py \
            tests/test_triage_stage05_close_probe.py \
            tests/test_triage_stage05_conformance.py \
            tests/test_triage_stage05_call_gate.py
      - name: Run Stage05 triage tests
        run: |
          python -m pytest -q \
            tests/test_triage_stage05_close_probe.py \
            tests/test_triage_stage05_conformance.py \
            tests/test_triage_stage05_call_gate.py
