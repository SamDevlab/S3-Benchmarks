name: Stage04 Conformance Triage

on:
  push:
    paths:
      - "tools/triage_stage04_conformance.py"
      - "tools/generate_stage04_cast_fixtures.py"
      - "tests/test_triage_stage04_conformance.py"
      - "tests/test_stage04_cast_fixtures.py"
      - ".github/workflows/stage04-conformance-triage.yml"
  pull_request:
    paths:
      - "tools/triage_stage04_conformance.py"
      - "tools/generate_stage04_cast_fixtures.py"
      - "tests/test_triage_stage04_conformance.py"
      - "tests/test_stage04_cast_fixtures.py"
      - ".github/workflows/stage04-conformance-triage.yml"
  workflow_dispatch:

jobs:
  triage-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pytest
      - name: Compile Stage04 helpers
        run: |
          python -m compileall -q \
            tools/triage_stage04_conformance.py \
            tools/generate_stage04_cast_fixtures.py \
            tests/test_triage_stage04_conformance.py \
            tests/test_stage04_cast_fixtures.py
      - name: Test Stage04 helpers
        run: |
          python -m pytest -q \
            tests/test_triage_stage04_conformance.py \
            tests/test_stage04_cast_fixtures.py
