jobs:
  s3ir2-v2-consumer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pytest
      - name: Compile v2 laboratory tools
        run: |
          python -m compileall -q \
            tools/generate_bootstrap_fuzz_corpus.py \
            tools/check_s3ir2_stage_map_contract.py \
            tools/ingest_s3ir2_v2.py \
            tools/render_s3ir2_v2_scorecard.py \
