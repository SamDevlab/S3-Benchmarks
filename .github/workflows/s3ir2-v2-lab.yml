      - name: Run focused v2 laboratory tests
        run: |
          python -m pytest -q \
            tests/test_bootstrap_fuzz_corpus.py \
            tests/test_s3ir2_stage_map_contract.py \
            tests/test_s3ir2_v2_ingest.py \
            tests/test_s3ir2_v2_lab_extensions.py \
            tests/test_s3ir2_v2_evidence_set.py \
            tests/test_s3ir2_v2_campaign_and_checkpoint.py \
            tests/test_s3ir2_v2_checkpoint_history.py \
