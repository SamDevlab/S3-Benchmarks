            tools/normalize_stage04_parser_attempt.py \
            tools/run_stage04_parser_recovery_gate.py \
            tools/audit_stage05_preparedness.py \
            tools/check_stage05_activation.py \
            tools/check_prepared_stage_activation.py \
            tools/evaluate_prepared_stage_checkpoint.py \
            tests/test_bootstrap_fuzz_corpus.py \
            tests/test_s3ir2_stage_map_contract.py \
            tests/test_s3ir2_v2_ingest.py \
            tests/test_s3ir2_v2_lab_extensions.py \
            tests/test_s3ir2_v2_evidence_set.py \
            tests/test_s3ir2_v2_campaign_and_checkpoint.py \
            tests/test_s3ir2_v2_checkpoint_history.py \
            tests/test_minimize_s3_failure.py \
            tests/test_compare_s3ir2_v2_campaigns.py \
