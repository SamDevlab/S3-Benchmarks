            tests/test_stage04_parser_recovery.py \
            tests/test_normalize_stage04_parser_attempt.py \
            tests/test_run_stage04_parser_recovery_gate.py \
            tests/test_stage05_preparedness.py \
            tests/test_stage05_activation.py \
            tests/test_prepared_stage_activation.py \
            tests/test_prepared_stage_checkpoint.py
      - name: Validate v2 laboratory JSON
        run: |
          python -c "import json; json.load(open('laboratory/bootstrap-v1/s3ir2-v2-stage-map.json', encoding='utf-8'))"
          python -c "import json; json.load(open('laboratory/bootstrap-v1/s3ir2-v2-evidence-contract.json', encoding='utf-8'))"
