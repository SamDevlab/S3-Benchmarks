name: S3IR2 v2 Laboratory

on:
  push:
    paths:
      - "tools/ingest_s3ir2_v2.py"
      - "tools/render_s3ir2_v2_scorecard.py"
      - "tools/check_s3ir2_v2_determinism.py"
      - "tools/capture_s3ir2_v2_failure_bundle.py"
      - "tools/classify_s3ir2_v2_failure.py"
      - "tools/ingest_s3ir2_v2_evidence_set.py"
      - "tests/test_s3ir2_v2_ingest.py"
      - "tests/test_s3ir2_v2_lab_extensions.py"
      - "laboratory/bootstrap-v1/s3ir2-v2-stage-map.json"
      - "laboratory/bootstrap-v1/s3ir2-v2-evidence-contract.json"
      - ".github/workflows/s3ir2-v2-lab.yml"
  pull_request:
    paths:
      - "tools/ingest_s3ir2_v2.py"
      - "tools/render_s3ir2_v2_scorecard.py"
      - "tools/check_s3ir2_v2_determinism.py"
      - "tools/capture_s3ir2_v2_failure_bundle.py"
      - "tools/classify_s3ir2_v2_failure.py"
      - "tools/ingest_s3ir2_v2_evidence_set.py"
      - "tests/test_s3ir2_v2_ingest.py"
      - "tests/test_s3ir2_v2_lab_extensions.py"
      - "laboratory/bootstrap-v1/s3ir2-v2-stage-map.json"
      - "laboratory/bootstrap-v1/s3ir2-v2-evidence-contract.json"
      - ".github/workflows/s3ir2-v2-lab.yml"
  workflow_dispatch:

jobs:
  s3ir2-v2-consumer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pytest
      - name: Compile v2 laboratory tools
        run: |
          python -m compileall -q \
            tools/ingest_s3ir2_v2.py \
            tools/render_s3ir2_v2_scorecard.py \
            tools/check_s3ir2_v2_determinism.py \
            tools/capture_s3ir2_v2_failure_bundle.py \
            tools/classify_s3ir2_v2_failure.py \
            tools/ingest_s3ir2_v2_evidence_set.py \
            tests/test_s3ir2_v2_ingest.py \
            tests/test_s3ir2_v2_lab_extensions.py
      - name: Validate v2 laboratory JSON
        run: |
          python -c "import json; json.load(open('laboratory/bootstrap-v1/s3ir2-v2-stage-map.json', encoding='utf-8'))"
          python -c "import json; json.load(open('laboratory/bootstrap-v1/s3ir2-v2-evidence-contract.json', encoding='utf-8'))"
      - name: Run focused v2 laboratory tests
        run: python -m pytest -q tests/test_s3ir2_v2_ingest.py tests/test_s3ir2_v2_lab_extensions.py
