          python -c "import json; json.load(open('laboratory/bootstrap-v1/stage05-fixture-plan.json', encoding='utf-8'))"
          python -c "import json; json.load(open('laboratory/bootstrap-v1/stage05-capability-matrix.json', encoding='utf-8'))"
