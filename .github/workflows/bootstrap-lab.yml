name: Bootstrap Laboratory Contracts

on:
  push:
    paths:
      - "laboratory/bootstrap-v1/**"
      - "tools/check_bootstrap_laboratory.py"
      - "tools/generate_bootstrap_fuzz_corpus.py"
      - "tools/classify_bootstrap_host.py"
      - "tools/import_s3_bootstrap_evidence.py"
      - "tools/run_bootstrap_differential.py"
      - "tools/summarize_bootstrap_semantic_coverage.py"
      - "tools/measure_bootstrap_resource_envelope.py"
      - "tools/check_bootstrap_determinism.py"
      - "tools/compare_bootstrap_stages.py"
      - "tests/test_bootstrap_*.py"
      - "tests/test_compare_bootstrap_stages.py"
      - ".github/workflows/bootstrap-lab.yml"
  pull_request:
    paths:
      - "laboratory/bootstrap-v1/**"
      - "tools/check_bootstrap_laboratory.py"
      - "tools/generate_bootstrap_fuzz_corpus.py"
      - "tools/classify_bootstrap_host.py"
      - "tools/import_s3_bootstrap_evidence.py"
      - "tools/run_bootstrap_differential.py"
      - "tools/summarize_bootstrap_semantic_coverage.py"
      - "tools/measure_bootstrap_resource_envelope.py"
      - "tools/check_bootstrap_determinism.py"
      - "tools/compare_bootstrap_stages.py"
      - "tests/test_bootstrap_*.py"
      - "tests/test_compare_bootstrap_stages.py"
      - ".github/workflows/bootstrap-lab.yml"
  workflow_dispatch:

jobs:
  static-bootstrap-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependency
        run: python -m pip install pytest

      - name: Compile laboratory tooling
        run: |
          python -m compileall -q \
            tools/check_bootstrap_laboratory.py \
            tools/generate_bootstrap_fuzz_corpus.py \
            tools/classify_bootstrap_host.py \
            tools/import_s3_bootstrap_evidence.py \
            tools/run_bootstrap_differential.py \
            tools/summarize_bootstrap_semantic_coverage.py \
            tools/measure_bootstrap_resource_envelope.py \
            tools/check_bootstrap_determinism.py \
            tools/compare_bootstrap_stages.py \
            tests/test_bootstrap_laboratory.py \
            tests/test_bootstrap_fuzz_corpus.py \
            tests/test_bootstrap_host_classification.py \
            tests/test_import_s3_bootstrap_evidence.py \
            tests/test_bootstrap_differential.py \
            tests/test_bootstrap_semantic_coverage.py \
            tests/test_bootstrap_resource_and_determinism.py \
            tests/test_compare_bootstrap_stages.py

      - name: Validate contract JSON
        run: |
          python -c "import json; json.load(open('laboratory/bootstrap-v1/contract.json', encoding='utf-8'))"
          python -c "import json; json.load(open('laboratory/bootstrap-v1/performance-host-contract.json', encoding='utf-8'))"
          python -c "import json; json.load(open('laboratory/bootstrap-v1/research-priority.json', encoding='utf-8'))"

      - name: Run bootstrap laboratory tests
        run: |
          python -m pytest -q \
            tests/test_bootstrap_laboratory.py \
            tests/test_bootstrap_fuzz_corpus.py \
            tests/test_bootstrap_host_classification.py \
            tests/test_import_s3_bootstrap_evidence.py \
            tests/test_bootstrap_differential.py \
            tests/test_bootstrap_semantic_coverage.py \
            tests/test_bootstrap_resource_and_determinism.py \
            tests/test_compare_bootstrap_stages.py

      - name: Validate pinned current checkpoint
        run: python tools/check_bootstrap_laboratory.py laboratory/bootstrap-v1/checkpoints/s3-0789ad2.json

      - name: Generate deterministic bootstrap corpus
        run: python tools/generate_bootstrap_fuzz_corpus.py --output .artifacts/bootstrap-corpus

      - name: Smoke resource characterization tool
        run: |
          python tools/measure_bootstrap_resource_envelope.py \
            --command "python -c 'print(42)'" \
            --output .artifacts/resource-smoke.json

      - name: Smoke Stage2/Stage3 missing-artifact semantics
        run: |
          python tools/compare_bootstrap_stages.py \
            --output .artifacts/stage-equivalence-smoke.json
          python -c "import json; d=json.load(open('.artifacts/stage-equivalence-smoke.json')); assert d['stage1_stage2_stage3_observable_equivalence'] == 'NOT_AVAILABLE'"
