name: Tests and Benchmarks

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  native-benchmark-verification:
    runs-on: ubuntu-latest

    steps:
      - name: Check out benchmark repository
        uses: actions/checkout@v4

      - name: Check out S3 compiler repository for historical JSMN baseline
        uses: actions/checkout@v4
        with:
          repository: SamDevlab/S3
          ref: 85541b782571c80d4857d013d1fb25b4997c1eb9
          path: s3-compiler

      - name: Check out current S3 M1.71-M1.80 benchmark baseline
        uses: actions/checkout@v4
        with:
          repository: SamDevlab/S3
          ref: cd6804f72757d6936ca1ec6c20d5badf55d1aac4
          path: s3-current

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install S3 compiler dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "./s3-compiler[dev]"

      - name: Validate Native Linux Toolchain
        run: |
          uname -m
          gcc --version
          as --version
          ld --version
          size --version

      - name: Validate Corpus Determinism
        run: |
          python benchmarks/jsmn/corpus/generator.py

      - name: Run JSMN Differential Correctness Gate
        env:
          S3_REPO: ${{ github.workspace }}/s3-compiler
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/s3-compiler
        run: |
          python tools/runner.py --verify-only

      - name: Run Async Runtime Behavioral Correctness Gate
        env:
          S3_CURRENT_REPO: ${{ github.workspace }}/s3-current
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/s3-current
        run: |
          python tools/async_runtime_runner.py --verify-only --output-json reports/async-runtime-correctness.json
          python -c "import json; data=json.load(open('reports/async-runtime-correctness.json')); assert data['passed'] is True; assert data['performance_results_valid'] is False; assert data['baseline_pin_match'] is True"

      - name: Run Reactor and Local Network Correctness Gate
        env:
          S3_CURRENT_REPO: ${{ github.workspace }}/s3-current
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/s3-current
        run: |
          python tools/network_loopback_runner.py --verify-only --output-json reports/network-loopback-correctness.json
          python -c "import json; data=json.load(open('reports/network-loopback-correctness.json')); assert data['passed'] is True; assert data['performance_results_valid'] is False; assert data['baseline_pin_match'] is True"

      - name: Run Local TLS Correctness Gate
        env:
          S3_CURRENT_REPO: ${{ github.workspace }}/s3-current
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/s3-current
        run: |
          python tools/tls_local_runner.py --verify-only --output-json reports/tls-local-correctness.json
          python -c "import json; data=json.load(open('reports/tls-local-correctness.json')); assert data['passed'] is True; assert data['performance_results_valid'] is False; assert data['baseline_pin_match'] is True; assert data['certificate_verification_required'] is True; assert data['hostname_verification_required'] is True"

      - name: Run AArch64 Structural Correctness Gate
        env:
          S3_CURRENT_REPO: ${{ github.workspace }}/s3-current
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/s3-current
        run: |
          python tools/aarch64_runner.py --verify-only --output-json reports/aarch64-structural.json
          python -c "import json; data=json.load(open('reports/aarch64-structural.json')); assert data['passed'] is True; assert data['s3_baseline_pin_match'] is True; assert data['llvm_reference_pin_match'] is True; assert data['performance_results_valid'] is False; assert data['comparative_code_quality_valid'] is False; assert data['execution_benchmark_valid'] is False"

      - name: Run Package Resolver Cache and Reproducibility Gate
        env:
          S3_CURRENT_REPO: ${{ github.workspace }}/s3-current
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/s3-current
        run: |
          python tools/package_repro_runner.py --verify-only --output-json reports/package-repro-correctness.json
          python -c "import json; data=json.load(open('reports/package-repro-correctness.json')); assert data['passed'] is True; assert data['baseline_pin_match'] is True; assert data['performance_results_valid'] is False; assert data['public_registry_required'] is False; assert data['registry_publishing_supported'] is False; assert data['remote_release_supported'] is False"

      - name: Run Native S3 & C Full Benchmark Suite
        env:
          S3_REPO: ${{ github.workspace }}/s3-compiler
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/s3-compiler
        run: |
          python tools/runner.py --full --output-json reports/jsmn-baseline.json --output-markdown reports/jsmn-baseline.md

      - name: Validate Generated Reports and Assert Invariants
        run: |
          test -f reports/jsmn-baseline.json
          test -f reports/jsmn-baseline.md
          test -f reports/async-runtime-correctness.json
          test -f reports/network-loopback-correctness.json
          test -f reports/tls-local-correctness.json
          test -f reports/aarch64-structural.json
          test -f reports/package-repro-correctness.json
          grep "PREVIOUS_PERFORMANCE_RESULTS_INVALIDATED" reports/jsmn-baseline.md
          grep "SYNTHETIC_TIMING" reports/jsmn-baseline.md
          python -c "import json; data=json.load(open('reports/jsmn-baseline.json')); assert any(r['variant'] == 'S3-O1-NATIVE' for r in data['results']), 'CI assertion error: S3-O1-NATIVE results missing!'"

      - name: Upload Benchmark and Correctness Report Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: s3-benchmark-artifacts-${{ github.sha }}
          path: |
            reports/jsmn-baseline.json
            reports/jsmn-baseline.md
            reports/async-runtime-correctness.json
            reports/network-loopback-correctness.json
            reports/tls-local-correctness.json
            reports/aarch64-structural.json
            reports/package-repro-correctness.json
