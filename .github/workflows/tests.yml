name: Tests and Benchmarks

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  benchmark-verification:
    runs-on: ubuntu-latest

    steps:
      - name: Check out benchmark repository
        uses: actions/checkout@v4

      - name: Check out S3 compiler repository
        uses: actions/checkout@v4
        with:
          repository: SamDevlab/S3
          ref: 85541b782571c80d4857d013d1fb25b4997c1eb9
          path: s3-compiler

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install S3 compiler dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "./s3-compiler[dev]"

      - name: Validate Native Toolchain Tools
        run: |
          uname -m
          gcc --version
          as --version
          ld --version

      - name: Validate Corpus Determinism
        run: |
          python benchmarks/jsmn/corpus/generator.py

      - name: Run Differential Correctness Gate
        env:
          S3_REPO: ${{ github.workspace }}/s3-compiler
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/s3-compiler
        run: |
          python tools/runner.py --verify-only

      - name: Run Native S3 Benchmark Smoke Test
        env:
          S3_REPO: ${{ github.workspace }}/s3-compiler
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/s3-compiler
        run: |
          python tools/runner.py --smoke --output-json reports/jsmn-baseline.json --output-markdown reports/jsmn-baseline.md

      - name: Validate Generated Reports Exist
        run: |
          test -f reports/jsmn-baseline.json
          test -f reports/jsmn-baseline.md
