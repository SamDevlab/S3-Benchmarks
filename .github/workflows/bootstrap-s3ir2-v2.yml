name: Bootstrap S3IR2 v2 Consumer

on:
  push:
    paths:
      - "tools/ingest_s3ir2_v2.py"
      - "tests/test_s3ir2_v2_ingest.py"
      - ".github/workflows/bootstrap-s3ir2-v2.yml"
  pull_request:
    paths:
      - "tools/ingest_s3ir2_v2.py"
      - "tests/test_s3ir2_v2_ingest.py"
      - ".github/workflows/bootstrap-s3ir2-v2.yml"
  workflow_dispatch:

jobs:
  s3ir2-v2-consumer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pytest
      - name: Compile consumer
        run: python -m compileall -q tools/ingest_s3ir2_v2.py tests/test_s3ir2_v2_ingest.py
      - name: Run focused consumer tests
        run: python -m pytest -q tests/test_s3ir2_v2_ingest.py
