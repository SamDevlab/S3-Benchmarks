name: RC1 Fast Correctness

on:
  pull_request:
  workflow_dispatch:

jobs:
  correctness:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out benchmark head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Check out immutable RC1 compiler
        uses: actions/checkout@v4
        with:
          repository: SamDevlab/S3
          ref: 9b39c7070d7bfa23d709c2128eb0b0bbef164177
          path: s3-compiler
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install compiler dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "./s3-compiler[dev]"

      - name: Run correctness-only automation
        env:
          BENCHMARK_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python -m benchmarks.rc1.automation \
            --mode correctness-only \
            --s3-repo "$GITHUB_WORKSPACE/s3-compiler" \
            --s3-sha 9b39c7070d7bfa23d709c2128eb0b0bbef164177 \
            --benchmark-sha "$BENCHMARK_SHA" \
            --output-dir reports/automation

      - name: Upload correctness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rc1-fast-correctness-${{ github.sha }}
          path: reports/automation
